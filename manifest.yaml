manifest_version: 1
persistence: none
app_author_name: "charlotte"
app:
  id: hack.app_4d63
  name: DayFlow
  version: 0.1.0
  summary: Plan scenic walks, find nearby places, and calculate BMI.
agent_types:
  - personal
outcomes:
  - id: walk.plan
    summary: Compare a direct walk and a scenic detour between two places within an available time
    example_phrases:
      - plan a scenic walk between two places
      - find a walking route with a sightseeing detour
      - can i walk between these appointments
      - suggest a scenic stop along my walking route
      - find a walking route that fits my available time
    inputs:
      - name: start_place
        type: string
        required: false
        description: Starting place or address explicitly provided by the user; leave blank if missing. Locations are sent to public mapping services.
      - name: destination
        type: string
        required: false
        description: Destination place or address explicitly provided by the user; leave blank if missing.
      - name: available_minutes
        type: number
        required: false
        description: Minutes available between plans, explicitly given or calculated from both times; omit if unknown and never guess.
      - name: buffer_minutes
        type: number
        required: false
        description: Minutes to reserve before the next plan if explicitly given; otherwise omit and use the app default.
      - name: max_extra_minutes
        type: number
        required: false
        description: Maximum extra walking minutes for a scenic detour if explicitly given; otherwise omit and use the app default.
      - name: weight_kg
        type: number
        required: false
        description: Weight in kilograms only if explicitly provided; otherwise omit and never guess.
    output:
      - name: route_verified
        type: boolean
        description: Whether DayFlow successfully checked the direct route; if false, do not invent route details, duration, distance, calories, or scenic stops.
      - name: direct_map_url
        type: string
        description: Google Maps walking directions link. Always show this link to the user so they can open the map. Google may calculate a different route.
      - name: scenic_map_url
        type: string
        description: Google Maps walking directions via the verified scenic stop, or empty if no stop was verified. Show the non-empty link.
      - name: start_resolved
        type: string
        description: Place name matched for the starting location.
      - name: destination_resolved
        type: string
        description: Place name matched for the destination.
      - name: direct_minutes
        type: number
        description: Estimated direct walking time in minutes.
      - name: direct_distance_km
        type: number
        description: Direct walking distance in kilometers.
      - name: available_walking_minutes
        type: number
        description: Minutes available for walking after the buffer.
      - name: fits_schedule
        type: boolean
        description: Whether the direct route fits within the available walking time.
      - name: scenic_found
        type: boolean
        description: Whether a scenic detour satisfies the time limits. If false, do not invent any scenic stops or claim that a detour was checked.
      - name: scenic_name
        type: string
        description: Name of the scenic stop, or empty if none is found.
      - name: scenic_minutes
        type: number
        description: Estimated walking time via the scenic stop, or zero if none is found.
      - name: scenic_distance_km
        type: number
        description: Walking distance via the scenic stop, or zero if none is found.
      - name: extra_minutes
        type: number
        description: Extra walking minutes compared with the direct route, or zero if none is found.
      - name: estimated_active_calories_kcal
        type: number
        description: Rough estimate of active walking calories, or zero if no weight was provided.
      - name: calories_estimated
        type: boolean
        description: Whether weight was provided and calories were estimated. If false, do not invent a calorie value.
      - name: note
        type: string
        description: Practical advice and limitations for the recommendation.
  - id: places.restaurants
    summary: Find restaurants near a named place and show a map search
    example_phrases:
      - restaurants near the british museum
      - where can i have lunch
      - show dining options in covent garden
      - suggest dinner spots
      - find food venues
    inputs:
      - name: location
        type: string
        required: false
        description: The place or address the user explicitly wants to search near; leave blank if missing and never guess. Sent to public mapping services.
    output:
      - name: location
        type: string
        description: The resolved search location, or the user's original location if lookup failed.
      - name: status
        type: string
        description: found, empty, or unavailable; when unavailable do not invent restaurant names.
      - name: venues
        type: string
        description: Verified map entries with straight-line distances and map links, or empty when none were found. Cuisine may be listed but menu, nutrition and healthiness are not verified.
      - name: map_url
        type: string
        description: Google Maps restaurant search link. Include this link in the answer.
      - name: note
        type: string
        description: Data limitations, attribution and privacy notice; include the limitations in the answer.
  - id: places.gyms
    summary: Find gyms near a named place and show a map search
    example_phrases:
      - gyms by paddington station
      - fitness centres around my destination
      - locate exercise facilities
      - recommend a health club
      - workout studios close to victoria
    inputs:
      - name: location
        type: string
        required: false
        description: The place or address the user explicitly wants to search near; leave blank if missing and never guess. Sent to public mapping services.
    output:
      - name: location
        type: string
        description: The resolved search location, or the user's original location if lookup failed.
      - name: status
        type: string
        description: found, empty, or unavailable; when unavailable do not invent gym names.
      - name: venues
        type: string
        description: Verified map entries with straight-line distances and map links, or empty when none were found.
      - name: map_url
        type: string
        description: Google Maps gym search link. Include this link in the answer.
      - name: note
        type: string
        description: Data limitations, attribution and privacy notice; include the limitations in the answer.
  - id: body.bmi
    summary: Calculate BMI from a height and weight provided by the user
    example_phrases:
      - calculate my bmi from my height and weight
      - calculate bmi for 170 cm and 60 kg
      - what is my body mass index
      - work out my bmi using my measurements
      - find my bmi from my weight and height
    inputs:
      - name: height_cm
        type: number
        required: false
        description: Height in centimetres explicitly provided by the user; never guess.
      - name: weight_kg
        type: number
        required: false
        description: Weight in kilograms explicitly provided by the user; never guess.
    output:
      - name: height_cm
        type: number
        description: Height supplied in centimetres.
      - name: weight_kg
        type: number
        description: Weight supplied in kilograms.
      - name: bmi
        type: number
        description: Calculated BMI, a rough screening measure rather than a diagnosis.
      - name: note
        type: string
        description: Limitations and privacy note; include this in the answer.
